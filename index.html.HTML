<style>

<div class="container">
    <h1>高雄85大樓</h1>

    <img src="https://upload.wikimedia.org/wikipedia/commons/5/5d/Tuntex_Sky_Tower_85_BUilding_Kaohsiung.jpg" alt="高雄85大樓">

    <p>
        高雄85大樓，又稱「85 Sky Tower」，位於台灣高雄市苓雅區，
        是高雄著名的地標之一。大樓高度約347.5公尺，共有85層樓，
        因此被稱為「85大樓」。
    </p>

    <p>
        85大樓於1997年完工，曾經是台灣最高的大樓，
        也是南台灣重要的商業與觀光中心。建築外型採用特殊的
        「高」字造型設計，象徵高雄城市意象。
    </p>

    <h2>特色介紹</h2>
    <ul>
        <li>樓高347.5公尺</li>
        <li>地上85層、地下5層</li>
        <li>設有觀景台，可俯瞰高雄港與市景</li>
        <li>結合辦公、飯店與商場功能</li>
    </ul>

    <h2>地理位置</h2>
    <p>
        地址：高雄市苓雅區自強三路5號
    </p>
